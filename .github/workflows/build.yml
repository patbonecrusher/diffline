name: Build

# Manual only: releases are normally cut locally with Tools/release.sh (Developer ID) and
# build.sh --sign appstore --pkg --upload (App Store). To run this in CI, add the secrets listed in
# RELEASING.md, then use "Run workflow" (or re-enable `push: tags: ['v*']`).
on:
  workflow_dispatch:
    inputs:
      appstore:
        description: Also build and upload the App Store package
        type: boolean
        default: false

jobs:
  # Developer ID build: notarized zip attached to a GitHub release (direct download).
  developer-id:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PWD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          rm certificate.p12
      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./build.sh --universal --sign devid --notarize
      - uses: actions/upload-artifact@v4
        with:
          name: Diffline-macos
          path: build/Diffline-*.zip
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')   # only when dispatched from a tag ref
        uses: softprops/action-gh-release@v2
        with:
          files: build/Diffline-*.zip
          generate_release_notes: true
      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')   # only when dispatched from a tag ref
        continue-on-error: true      # needs a HOMEBREW_TAP_TOKEN secret (PAT with repo scope on homebrew-tap)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh api repos/patbonecrusher/homebrew-tap/dispatches -f event_type=update-cask \
            -f "client_payload[version]=${GITHUB_REF#refs/tags/v}" -f "client_payload[cask]=diffline"

  # Mac App Store build: signed .pkg uploaded to App Store Connect.
  app-store:
    if: inputs.appstore
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Import distribution certificates
        env:
          MACOS_DIST_CERTIFICATE: ${{ secrets.MACOS_DIST_CERTIFICATE }}
          MACOS_DIST_CERTIFICATE_PWD: ${{ secrets.MACOS_DIST_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_DIST_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PWD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_DIST_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          rm certificate.p12
      - name: Install provisioning profile and API key
        env:
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          echo "$MAC_PROVISIONING_PROFILE" | base64 --decode > Resources/Diffline.provisionprofile
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Build, sign, package, upload
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ./build.sh --universal --sign appstore --pkg --upload
      - uses: actions/upload-artifact@v4
        with:
          name: Diffline-appstore-pkg
          path: build/Diffline-*.pkg
